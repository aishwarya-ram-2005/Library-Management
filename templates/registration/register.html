{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}
<div class="auth-card card shadow-sm"><div class="card-body p-4"><h2 class="mb-3">Create Librarian Account</h2>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Register</button></form>
<p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p></div></div>{% endblock %}
