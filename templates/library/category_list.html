{% extends 'base.html' %}{% block content %}<h1>Categories</h1><div class="row g-4"><div class="col-md-5"><div class="card card-body"><h5>Add category</h5><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Add</button></form></div></div><div class="col-md-7"><div class="card"><ul class="list-group list-group-flush">{% for category in categories %}<li class="list-group-item">{{ category.name }} <span class="text-muted">({{ category.books.count }} books)</span></li>{% empty %}<li class="list-group-item">No categories yet.</li>{% endfor %}</ul></div></div></div>{% endblock %}
